name: needhub
description: NeedHub — general location-aware needs-first marketplace
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # HTTP
  dio: ^5.4.0

  # Secure storage (for auth tokens)
  flutter_secure_storage: ^9.0.0

  # Image picker (profile photos, need post images — Phase 2)
  image_picker: ^1.1.0
  image_cropper: ^8.0.2

  # Location
  geolocator: ^11.0.0

  # Maps (OpenStreetMap — no API key required)
  flutter_map: ^7.0.0
  latlong2: ^0.9.0

  # Fonts (Bricolage Grotesque + Hanken Grotesk per design spec)
  google_fonts: ^6.2.0

  # Theme persistence
  shared_preferences: ^2.3.0

  # WebSockets — real-time messages and notifications
  socket_io_client: ^3.0.2

  # UI utilities
  cached_network_image: ^3.3.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  share_plus: ^12.0.2
  mobile_scanner: ^7.4.0
  url_launcher: ^6.3.2
  speech_to_text: ^7.0.0
  mappls_gl: ^2.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
